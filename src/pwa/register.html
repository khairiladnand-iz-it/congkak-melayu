<script>
/* daftar service worker hanya pada hos sebenar, bukan dalam bingkai artifact */
if ('serviceWorker' in navigator && window.top === window.self && (location.protocol === 'https:' || ['localhost','127.0.0.1'].includes(location.hostname))) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
